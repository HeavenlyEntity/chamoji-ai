name: chamoji changelog
description: Release notes, PR changelog previews and one-step releases from your commits, with chamoji.
author: HeavenlyEntity
branding:
  icon: book-open
  color: purple

inputs:
  mode:
    description: >-
      auto (default) writes release notes on a tag push, a changelog preview
      comment on a pull request, releases on workflow_dispatch, and on a push
      to the default branch runs merge (publishes what npm lacks, then
      releases when release.trigger is merge). Or set notes, comment, release
      (cuts a release with `chamoji release --push`), merge, publish
      (publishes what the pushed tag released, with `chamoji publish --from`)
      or card (saves the repo's card image alone on card-branch; needs
      contents write, and a schedule or push trigger of your own, since auto
      never picks it).
    default: auto
  chamoji-version:
    description: '@chamoji/cli version to run with npx.'
    default: latest
  cli:
    description: >-
      Command that runs chamoji instead of npx, such as `node
      packages/cli/dist/cli.js`. In a repo with release units, the PR preview
      runs it with its working directory at the PR head and never with
      secrets, so it must be unset, `node` with a built CLI file from the
      workspace, or `chamoji` itself; anything else (npx, a shell wrapper,
      tsx) and any option word is refused.
    default: ''
  release-version:
    description: release mode only. The version to release; empty lets chamoji pick it from the commits.
    default: ''
  unit:
    description: >-
      release mode only. In a repo with release units, release just this unit;
      empty releases every unit that has changes of its own.
    default: ''
  publish:
    description: >-
      auto publishes to npm in release and merge mode when chamoji.config.json
      sets release.publish; false never does. Trusted publishing needs
      id-token write.
    default: auto
  npm-token:
    description: >-
      An npm token, from a repository secret, to publish with instead of
      trusted publishing. The Action masks it and passes it, as
      CHAMOJI_NPM_TOKEN, only to the CLI calls that publish, never on a pull
      request.
    default: ''
  ai:
    description: Sort vague commits with Jev (needs typesafe-api-key).
    default: 'false'
  typesafe-api-key:
    description: TypeSafe API key, for ai.
    default: ''
  comment-author:
    description: >-
      comment mode only. The login github-token acts as, so the Action only
      updates its own preview comment. Set it when github-token is a personal
      token.
    default: github-actions[bot]
  card-endpoint:
    description: card mode only. The renderer that draws the card image.
    default: https://chamoji.dev/api/card
  card-branch:
    description: >-
      card mode only. The branch that holds nothing but card.png. chamoji
      force-pushes it, so it refuses a branch that holds anything else.
    default: chamoji-card
  github-token:
    description: >-
      Token for gh. notes, release and merge need contents write; comment
      needs pull-requests write. card doesn't use it: it pushes with the credential
      that actions/checkout saved, so give the job contents write.
    default: ${{ github.token }}

outputs:
  version:
    description: The tag that was released or given notes (every released tag, comma-separated, in a repo with release units).
    value: ${{ steps.run.outputs.version }}
  notes-file:
    description: notes mode only. Path to the release notes.
    value: ${{ steps.run.outputs.notes-file }}
  card-url:
    description: card mode only. The raw GitHub address of the card image.
    value: ${{ steps.run.outputs.card-url }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - id: run
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/action/run.sh"
      env:
        CHAMOJI_MODE: ${{ inputs.mode }}
        CHAMOJI_VERSION: ${{ inputs.chamoji-version }}
        CHAMOJI_CLI: ${{ inputs.cli }}
        CHAMOJI_RELEASE_VERSION: ${{ inputs.release-version }}
        CHAMOJI_UNIT: ${{ inputs.unit }}
        CHAMOJI_COMMENT_AUTHOR: ${{ inputs.comment-author }}
        CHAMOJI_CARD_URL: ${{ inputs.card-endpoint }}
        CHAMOJI_CARD_BRANCH: ${{ inputs.card-branch }}
        CHAMOJI_AI: ${{ inputs.ai }}
        CHAMOJI_PUBLISH: ${{ inputs.publish }}
        CHAMOJI_NPM_TOKEN: ${{ inputs.npm-token }}
        TYPESAFE_API_KEY: ${{ inputs.typesafe-api-key }}
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
