name: Release

# Publishes both packages to npm when a v* tag is pushed (made by `pnpm release`).
# It can also be run by hand for an existing tag ("Run workflow", or
# `gh workflow run release.yml -f tag=v1.2.3`), which re-publishes that tag's
# code using this file's steps, without moving the tag.
#
# Uses npm trusted publishing (OIDC): no npm token is stored. Each package
# lists this repo and this workflow as its trusted publisher on npmjs.com.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, e.g. v1.2.3
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check the tag name
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Not a release tag: $TAG"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      # No registry-url here: it writes an .npmrc with a placeholder
      # NODE_AUTH_TOKEN, and npm then tries that token instead of trusted
      # publishing (OIDC), which the registry rejects with a 404.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest && npm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test

      - name: Check the tag matches both package versions
        run: |
          for pkg in packages/core packages/cli; do
            version=$(node -p "require('./$pkg/package.json').version")
            if [ "v$version" != "$TAG" ]; then
              echo "::error::$pkg is $version but the tag is $TAG"
              exit 1
            fi
          done

      # pnpm pack swaps workspace:* for real versions; npm publish then adds
      # provenance. Core goes first because the CLI depends on it. Tarball
      # paths start with ./ so npm doesn't read them as GitHub shorthand.
      # Versions already on npm are skipped, so a re-run finishes a partial
      # release.
      - name: Publish
        run: |
          mkdir -p dist-packages
          for pkg in packages/core packages/cli; do
            (cd "$pkg" && pnpm pack --pack-destination ../../dist-packages)
          done
          version="${TAG#v}"
          for name in core cli; do
            if npm view "@chamoji/$name@$version" version >/dev/null 2>&1; then
              echo "@chamoji/$name@$version is already published; skipping"
              continue
            fi
            npm publish "./dist-packages/chamoji-$name-$version.tgz" --provenance --access public
          done
