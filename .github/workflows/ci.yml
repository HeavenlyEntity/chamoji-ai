name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}${{ matrix.shards > 1 && format(' · {0}/{1}', matrix.shard, matrix.shards) || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
        shard: [1]
        shards: [1]
        # Windows starts processes several times slower, and the tests start
        # thousands of git processes, so its tests are split across 3 jobs.
        include:
          - {os: windows-latest, node: 22, shard: 1, shards: 3}
          - {os: windows-latest, node: 22, shard: 2, shards: 3}
          - {os: windows-latest, node: 22, shard: 3, shards: 3}
          - {os: windows-latest, node: 24, shard: 1, shards: 3}
          - {os: windows-latest, node: 24, shard: 2, shards: 3}
          - {os: windows-latest, node: 24, shard: 3, shards: 3}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: the tests and chamoji itself read git history.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # check builds as well; the other shards still need the build, since
      # some tests run the built CLI.
      - run: pnpm check
        if: matrix.shard == 1
      - run: pnpm build
        if: matrix.shard != 1
      - run: pnpm test --shard=${{ matrix.shard }}/${{ matrix.shards }}
